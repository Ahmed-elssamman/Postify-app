<div
  class="min-h-screen bg-[radial-gradient(circle_at_top,rgba(219,234,254,0.8),transparent_34%),linear-gradient(180deg,#fcfaf4_0%,#f7f1e8_100%)] text-slate-900"
>

    <div
      class="fixed inset-0 z-90 flex items-center justify-center bg-[#fcfaf4]/78 backdrop-blur-sm"
    >
      <div
        class="flex flex-col items-center gap-5 rounded-4xl border border-orange-200/80 bg-white/92 px-10 py-9 shadow-[0_30px_80px_-32px_rgba(234,88,12,0.35)]"
      >
        <div
          class="h-[4.5rem] w-[4.5rem] animate-spin rounded-full border-[6px] border-orange-200 border-r-orange-600 border-t-orange-500 shadow-[0_0_0_10px_rgba(255,237,213,0.65)]"
          aria-hidden="true"
        ></div>
        <div class="text-center">
          <p class="text-sm font-semibold uppercase tracking-[0.28em] text-orange-500">Postify</p>
          <p class="mt-2 font-serif text-3xl font-semibold text-slate-900">Loading</p>
        </div>
      </div>
    </div>
  }

  <app-navbar />

  <main class="mx-auto w-full max-w-7xl px-4 pb-16 pt-8 sm:px-6 lg:px-8 lg:pt-12">
    <router-outlet />

</div>
